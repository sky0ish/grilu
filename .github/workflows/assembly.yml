name: 경기도의회 회의록 자동 수집 (kms.ggc.go.kr)

on:
  schedule:
    - cron: "30 20 * * *"     # 매일 05:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests kiwipiepy
      - name: 경기연구원 언급 회의록 검색·새 회의록 본문 수집
        run: python tools/import_assembly.py
      - name: 변경 시에만 페이지 재생성·커밋
        run: |
          if git diff --quiet -- data/assembly.json && [ -z "$(git status --porcelain data/assembly)" ]; then echo "새 회의록 없음"; exit 0; fi
          python build.py
          git config user.name "grilu-bot"
          git config user.email "union@grilu.kr"
          git add -A
          git commit -m "경기도의회 회의록 자동 수집 $(date -u +'%Y-%m-%d')"
          git push
